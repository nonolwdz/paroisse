<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités - Paroisse Saint-François d'Assise</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { violet: '#4c1d95', prune: '#701a75', or: '#eab308', fond: '#f8fafc', texte: '#334155' }, fontFamily: { sans: ['Nunito', 'sans-serif'] } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>.quill-content img { border-radius: 0.5rem; margin: 1rem 0; max-height: 400px; width: auto; }</style>
</head>
<body class="bg-fond text-texte font-sans min-h-screen flex flex-col relative">

    <div id="maintenance-overlay" class="fixed inset-0 bg-violet z-[100] flex flex-col items-center justify-center text-white hidden">
        <span class="text-6xl mb-6 animate-pulse">🚧</span>
        <h1 class="text-4xl font-extrabold mb-4 text-center px-4">Site en maintenance</h1>
        <p id="maintenance-msg" class="text-xl font-medium text-center px-6 max-w-2xl text-violet-200">Nous revenons vite.</p>
    </div>

    <header class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-violet/10">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-violet text-or p-2 rounded-xl shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 3v18m-6-12h12"></path></svg>
                </div>
                <div><span class="text-2xl font-extrabold text-violet tracking-tight">Saint-François d'Assise</span></div>
            </div>
            <nav class="mt-4 md:mt-0 flex flex-wrap justify-center gap-x-5 gap-y-2 text-sm font-bold text-slate-500">
                <a href="/" class="hover:text-violet transition-colors">Accueil</a>
                <a href="/actualites" class="text-violet border-b-2 border-violet pb-1">Actualités</a>
                <a href="/messes" class="hover:text-violet transition-colors">Messes & autres événements</a>
                <a href="/horaires" class="hover:text-violet transition-colors">Ouverture Églises</a>
                <a href="/contact" class="hover:text-violet transition-colors">Contact / Aide</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight">Toutes les Actualités</h1>
            <p class="text-slate-500 font-semibold text-lg mt-2">La vie de la paroisse au fil des jours.</p>
        </div>
        
        <div id="actualites-container" class="space-y-8">
            <p class="text-slate-400 font-semibold italic text-center">Chargement...</p>
        </div>
    </main>

    <footer class="bg-slate-800 text-slate-300 text-center py-8 mt-8 font-semibold text-sm"><p>&copy; 2026 Paroisse Saint-François d'Assise</p></footer>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkMaintenance() {
            try {
                const { data } = await _supabase.from('site_config').select('*').eq('id', 1).single();
                if (data && data.est_en_pause) {
                    document.getElementById('maintenance-msg').innerText = data.message_pause || "Le site est actuellement en pause. Merci de votre patience.";
                    document.getElementById('maintenance-overlay').classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                }
            } catch(e) {}
        }
        checkMaintenance();

        async function chargerToutesActualites() {
            const { data } = await _supabase.from('actualites').select('*').order('date_publication', { ascending: false });
            const c = document.getElementById('actualites-container');
            if (!data || data.length===0) { c.innerHTML = '<p class="text-slate-500 text-center">Aucune actualité pour le moment.</p>'; return; }
            c.innerHTML = data.map(actu => `
                <article class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 pb-4 border-b border-slate-100">
                        <h3 class="text-2xl font-bold text-violet">${actu.titre}</h3>
                        <span class="bg-violet/5 text-violet text-xs font-bold px-3 py-1.5 rounded-lg whitespace-nowrap">
                            📅 ${actu.date_publication ? new Date(actu.date_publication).toLocaleDateString('fr-FR') : 'Récent'}
                        </span>
                    </div>
                    <div class="text-slate-600 font-medium leading-relaxed quill-content">${actu.contenu}</div>
                </article>
            `).join('');
        }
        chargerToutesActualites();
    </script>
</body>
</html>
