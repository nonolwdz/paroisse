<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouverture des Églises - Paroisse</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ciel: '#0ea5e9', soleil: '#fdba74', menthe: '#34d399', fraise: '#fb7185', fond: '#f8fafc', nuit: '#1e293b' }, fontFamily: { sans: ['Nunito', 'sans-serif'] } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-fond text-slate-700 font-sans min-h-screen flex flex-col">

    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b-[3px] border-ciel/20">
        <div class="max-w-6xl mx-auto px-6 py-3 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-3 group cursor-pointer hover:scale-105 transition-transform">
                <div class="bg-soleil text-nuit p-2.5 rounded-full shadow-lg shadow-soleil/30 transform rotate-[-10deg] group-hover:rotate-0 transition-all">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 3v18m-6-12h12"></path></svg>
                </div>
                <div><span class="text-2xl font-black text-slate-800 tracking-tight">Saint-François d'Assise</span></div>
            </div>
            <nav class="mt-4 md:mt-0 flex gap-6 text-base font-bold text-slate-500">
                <a href="/" class="hover:text-ciel hover:-translate-y-1 transition-all">Accueil</a>
                <a href="/messes" class="hover:text-ciel hover:-translate-y-1 transition-all">Messes</a>
                <a href="/horaires" class="text-nuit border-b-[3px] border-soleil pb-1">Ouverture Églises</a>
                <a href="/contact" class="hover:text-ciel hover:-translate-y-1 transition-all">Contact / Aide</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black text-slate-800 tracking-tight">Visite & Prière</h1>
            <p class="text-slate-500 font-bold text-lg mt-2">Trouvez une église ouverte près de chez vous pour un instant de paix.</p>
        </div>
        
        <div class="mb-10 max-w-2xl mx-auto space-y-4">
            <div class="relative">
                <span class="absolute left-5 top-1/2 -translate-y-1/2 text-2xl">🔍</span>
                <input type="text" id="recherche-eglise" oninput="filtrerEglises()" placeholder="Rechercher une église..." class="w-full bg-white border-2 border-slate-200 rounded-2xl pl-14 pr-6 py-4 text-slate-800 font-bold text-lg outline-none shadow-sm focus:border-ciel transition-all">
            </div>
            <label class="flex items-center justify-center gap-3 bg-white border border-slate-200 p-4 rounded-2xl shadow-sm cursor-pointer hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filtre-ouvertes" onchange="filtrerEglises()" class="w-6 h-6 rounded border-slate-300 text-ciel focus:ring-ciel cursor-pointer">
                <span class="font-black text-slate-700">Voir uniquement les églises ouvertes actuellement</span>
            </label>
        </div>

        <div id="liste-eglises" class="space-y-6"></div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let eglisesData = [];

        function getStatut(e) {
            if (e.est_ferme) return { text: "Fermeture exceptionnelle", color: "bg-fraise/10 text-fraise", isOpen: false };
            if (!e.horaires_json) return { text: "Horaires inconnus", color: "bg-slate-100 text-slate-500", isOpen: false };

            let h; try { h = JSON.parse(e.horaires_json); } catch(err) { return { text: "Horaires inconnus", color: "bg-slate-100 text-slate-500", isOpen: false }; }
            if (h.type === 'inconnu' || !h.type) return { text: "Horaires inconnus", color: "bg-slate-100 text-slate-500", isOpen: false };

            const now = new Date(); const day = now.getDay(); const minsNow = now.getHours() * 60 + now.getMinutes();
            let slots = []; const parseTime = (str) => { if(!str) return null; const [hh, mm] = str.split(':').map(Number); return hh * 60 + mm; };
            const addSlot = (start, end) => { const s = parseTime(start), e = parseTime(end); if(s !== null && e !== null) slots.push({s, e}); };

            if (h.type === 'tous') { addSlot(h.tous_m_s, h.tous_m_e); addSlot(h.tous_a_s, h.tous_a_e); } 
            else if (h.type === 'semaine_we') {
                if (day >= 1 && day <= 5) { addSlot(h.sem_m_s, h.sem_m_e); addSlot(h.sem_a_s, h.sem_a_e); } 
                else if (day === 6) { addSlot(h.sam_m_s, h.sam_m_e); addSlot(h.sam_a_s, h.sam_a_e); } 
                else if (day === 0) { addSlot(h.dim_m_s, h.dim_m_e); addSlot(h.dim_a_s, h.dim_a_e); } 
            }

            if (slots.length === 0) return { text: "Fermée aujourd'hui", color: "bg-fraise/10 text-fraise", isOpen: false };

            let status = { text: "Fermée", color: "bg-slate-100 text-slate-500", isOpen: false };
            for (let slot of slots) {
                if (minsNow >= slot.s && minsNow < (slot.e - 30)) return { text: "Ouverte actuellement", color: "bg-menthe/20 text-emerald-700", isOpen: true };
                if (minsNow >= (slot.e - 30) && minsNow < slot.e) return { text: "Ferme bientôt", color: "bg-soleil/30 text-orange-800", isOpen: true };
                if (minsNow >= (slot.s - 30) && minsNow < slot.s) status = { text: "Ouvre bientôt", color: "bg-ciel/20 text-ciel", isOpen: false };
            } return status;
        }

        async function chargerEglises() {
            const { data } = await _supabase.from('horaires_eglises').select('*'); eglisesData = data || []; filtrerEglises();
        }

        function filtrerEglises() {
            const recherche = document.getElementById('recherche-eglise').value.toLowerCase();
            const filtreOuvert = document.getElementById('filtre-ouvertes').checked;
            const container = document.getElementById('liste-eglises');
            let resultats = eglisesData.filter(e => e.nom.toLowerCase().includes(recherche));

            container.innerHTML = resultats.map(e => {
                const statut = getStatut(e);
                if (filtreOuvert && !statut.isOpen) return ''; 
                const texteHoraires = e.horaires_base || "Horaires non communiqués";

                return `
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col md:flex-row gap-6 items-center md:items-start transition-all hover:shadow-md">
                    <div class="flex flex-col items-center gap-3 min-w-[160px]">
                        <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center text-3xl">⛪</div>
                        <span class="px-4 py-1 rounded-full text-xs font-black ${statut.color} text-center leading-tight shadow-sm">${statut.text}</span>
                    </div>
                    <div class="flex-grow text-center md:text-left w-full">
                        <h2 class="text-2xl font-black text-slate-800 mb-2">${e.nom}</h2>
                        <p class="text-slate-600 font-bold whitespace-pre-line text-base leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100">${texteHoraires}</p>
                        ${e.alerte ? `<div class="mt-4 bg-fraise/10 border-l-4 border-fraise p-3 rounded-r-xl"><p class="text-fraise text-sm font-black">⚠️ ${e.alerte}</p></div>` : ''}
                    </div>
                </div>`;
            }).join('');

            if (container.innerHTML === '') container.innerHTML = '<p class="text-slate-400 text-center py-12 font-bold text-xl">Aucune église ne correspond à votre recherche.</p>';
        }

        chargerEglises(); setInterval(filtrerEglises, 60000);
    </script>
</body>
</html>
