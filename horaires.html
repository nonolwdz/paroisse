<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouverture des Églises - Paroisse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { nuit: '#1e3a8a', or: '#d97706', sable: '#fef3c7' }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-nuit text-or p-2 rounded-full shadow-md"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 3v18m-6-12h12"></path></svg></div>
                <span class="text-2xl font-serif font-bold text-nuit block leading-none">Saint-François d'Assise</span>
            </div>
            <nav class="mt-4 md:mt-0 flex gap-8 text-sm font-semibold text-slate-600">
                <a href="/" class="hover:text-nuit pb-1 transition-all">Accueil</a>
                <a href="/messes" class="hover:text-nuit pb-1 transition-all">Messes</a>
                <a href="/horaires" class="text-or border-b-2 border-or pb-1 transition-all">Ouverture des Églises</a>
                <a href="/contact" class="hover:text-nuit pb-1 transition-all">Contact</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-16 flex-grow w-full">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-serif font-bold text-nuit mb-4">Visite et Recueillement</h1>
            <p class="text-slate-600 text-lg">Consultez l'état d'ouverture de nos églises en temps réel.</p>
        </div>
        
        <div class="mb-8 max-w-2xl mx-auto space-y-4">
            <input type="text" id="recherche-eglise" oninput="filtrerEglises()" placeholder="🔍 Rechercher une église..." class="w-full border-2 border-slate-200 rounded-xl p-4 text-slate-700 outline-none shadow-sm">
            <label class="flex items-center gap-3 bg-white p-3 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:bg-slate-50 transition-colors">
                <input type="checkbox" id="filtre-ouvertes" onchange="filtrerEglises()" class="w-5 h-5 accent-emerald-500 cursor-pointer">
                <span class="font-bold text-slate-700">N'afficher que les églises ouvertes actuellement</span>
            </label>
        </div>

        <div id="liste-eglises" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-center py-10 text-sm mt-auto"><p>&copy; 2026 Paroisse Saint-François d'Assise</p></footer>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let eglisesData = [];

        function getStatut(e) {
            if (e.est_ferme) return { text: "Fermeture exceptionnelle", color: "bg-red-100 text-red-800 border-red-300", isOpen: false };
            if (!e.horaires_json) return { text: "Horaires inconnus", color: "bg-slate-100 text-slate-500 border-slate-200", isOpen: false };

            let h;
            try { h = JSON.parse(e.horaires_json); } catch(err) { return { text: "Horaires inconnus", color: "bg-slate-100 text-slate-500 border-slate-200", isOpen: false }; }
            
            if (h.type === 'inconnu' || !h.type) return { text: "Horaires inconnus", color: "bg-slate-100 text-slate-500 border-slate-200", isOpen: false };

            const now = new Date();
            const day = now.getDay(); 
            const minsNow = now.getHours() * 60 + now.getMinutes();

            let slots = [];
            const parseTime = (str) => { if(!str) return null; const [hh, mm] = str.split(':').map(Number); return hh * 60 + mm; };
            const addSlot = (start, end) => { const s = parseTime(start), e = parseTime(end); if(s !== null && e !== null) slots.push({s, e}); };

            if (h.type === 'tous') {
                addSlot(h.tous_m_s, h.tous_m_e); addSlot(h.tous_a_s, h.tous_a_e);
            } else if (h.type === 'semaine_we') {
                if (day >= 1 && day <= 5) { addSlot(h.sem_m_s, h.sem_m_e); addSlot(h.sem_a_s, h.sem_a_e); } 
                else if (day === 6) { addSlot(h.sam_m_s, h.sam_m_e); addSlot(h.sam_a_s, h.sam_a_e); } 
                else if (day === 0) { addSlot(h.dim_m_s, h.dim_m_e); addSlot(h.dim_a_s, h.dim_a_e); } 
            }

            // MODIFICATION ICI : Le badge devient Rouge vif quand c'est fermé
            if (slots.length === 0) return { text: "Fermée aujourd'hui", color: "bg-red-100 text-red-800 border-red-300", isOpen: false };

            let status = { text: "Fermée actuellement", color: "bg-red-100 text-red-800 border-red-300", isOpen: false };
            
            for (let slot of slots) {
                if (minsNow >= slot.s && minsNow < (slot.e - 30)) return { text: "Ouverte actuellement", color: "bg-emerald-100 text-emerald-800 border-emerald-300", isOpen: true };
                if (minsNow >= (slot.e - 30) && minsNow < slot.e) return { text: "Ferme bientôt", color: "bg-orange-100 text-orange-800 border-orange-300", isOpen: true };
                if (minsNow >= (slot.s - 30) && minsNow < slot.s) status = { text: "Ouvre bientôt", color: "bg-blue-100 text-blue-800 border-blue-300", isOpen: false };
            }
            return status;
        }

        async function chargerEglises() {
            const { data } = await _supabase.from('horaires_eglises').select('*');
            eglisesData = data || [];
            filtrerEglises();
        }

        function filtrerEglises() {
            const recherche = document.getElementById('recherche-eglise').value.toLowerCase();
            const filtreOuvert = document.getElementById('filtre-ouvertes').checked;
            const container = document.getElementById('liste-eglises');
            
            let resultats = eglisesData.filter(e => e.nom.toLowerCase().includes(recherche));

            container.innerHTML = resultats.map(e => {
                const statut = getStatut(e);
                if (filtreOuvert && !statut.isOpen) return ''; 
                const texteHoraires = e.horaires_base || "Horaires non communiqués";

                return `
                <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-nuit flex flex-col h-full relative">
                    <span class="absolute top-4 right-4 px-3 py-1 rounded-full text-xs font-bold border ${statut.color}">${statut.text}</span>
                    <h2 class="text-2xl font-serif font-bold text-nuit mb-4 pr-32">${e.nom}</h2>
                    <p class="text-slate-600 font-medium mb-4 whitespace-pre-line"><span class="text-or">🕒</span> ${texteHoraires}</p>
                    ${e.alerte ? `<div class="mt-auto bg-red-50 border-l-4 border-red-600 p-4 rounded-r-lg shadow-sm"><p class="text-red-800 text-sm font-bold flex gap-2"><span class="text-lg">⚠️</span> <span>${e.alerte}</span></p></div>` : ''}
                </div>`;
            }).join('');

            if (container.innerHTML === '') container.innerHTML = '<p class="text-slate-500 text-center col-span-full py-8 italic">Aucune église ne correspond à vos critères (ou aucune n\'est ouverte actuellement).</p>';
        }

        chargerEglises();
        setInterval(filtrerEglises, 60000);
    </script>
</body>
</html>
