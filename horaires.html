<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouverture des Églises - Paroisse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { nuit: '#1e3a8a', or: '#d97706', sable: '#fef3c7' }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- NAVIGATION -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-nuit text-or p-2 rounded-full shadow-md"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 3v18m-6-12h12"></path></svg></div>
                <span class="text-2xl font-serif font-bold text-nuit block leading-none">Saint-François d'Assise</span>
            </div>
            <nav class="mt-4 md:mt-0 flex gap-8 text-sm font-semibold text-slate-600">
                <a href="/" class="hover:text-nuit pb-1 transition-all">Accueil</a>
                <a href="/messes" class="hover:text-nuit pb-1 transition-all">Messes</a>
                <a href="/horaires" class="text-or border-b-2 border-or pb-1 transition-all">Ouverture des Églises</a>
                <a href="/contact" class="hover:text-nuit pb-1 transition-all">Contact</a>
            </nav>
        </div>
    </header>

    <!-- CONTENU -->
    <main class="max-w-5xl mx-auto px-6 py-16 flex-grow w-full">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-serif font-bold text-nuit mb-4">Visite et Recueillement</h1>
            <p class="text-slate-600 text-lg">Consultez les horaires d'ouverture de nos églises pour un temps de prière personnelle.</p>
        </div>
        
        <div id="liste-eglises" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <p class="text-slate-400 italic text-center col-span-full py-8">Chargement des horaires en cours...</p>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-center py-10 text-sm mt-auto"><p>&copy; 2026 Paroisse Saint-François d'Assise</p></footer>

    <!-- SCRIPT -->
    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function chargerEglises() {
            const container = document.getElementById('liste-eglises');
            const { data, error } = await _supabase.from('horaires_eglises').select('*');

            if (error) { container.innerHTML = '<p class="text-red-500 col-span-full text-center">Erreur de chargement.</p>'; return; }
            if (!data || data.length === 0) { container.innerHTML = '<p class="text-slate-500 text-center col-span-full py-8">Aucun horaire renseigné pour l\'instant.</p>'; return; }

            container.innerHTML = data.map(e => `
                <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-nuit flex flex-col h-full">
                    <h2 class="text-2xl font-serif font-bold text-nuit mb-4 flex items-center gap-2"><span>⛪</span> ${e.nom}</h2>
                    <p class="text-slate-600 font-medium mb-4 flex-grow"><span class="text-or">🕒</span> ${e.horaires_base}</p>
                    
                    ${e.alerte ? `
                    <div class="mt-auto bg-red-50 border-l-4 border-red-600 p-4 rounded-r-lg shadow-sm">
                        <p class="text-red-800 text-sm font-bold flex items-start gap-2">
                            <span class="text-lg leading-none">⚠️</span> 
                            <span>${e.alerte}</span>
                        </p>
                    </div>` : ''}
                </div>
            `).join('');
        }
        chargerEglises();
    </script>
</body>
</html>
