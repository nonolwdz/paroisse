<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messes - Paroisse Saint-François d'Assise</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ciel: '#0ea5e9', soleil: '#f97316', menthe: '#10b981', fraise: '#f43f5e', fond: '#f8fafc' }, fontFamily: { sans: ['Nunito', 'sans-serif'] } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>
    
    <style>
        .fc { font-family: 'Nunito', sans-serif; font-weight: bold; }
        .fc-theme-standard .fc-scrollgrid { border: none; border-radius: 2rem; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 4px solid white; }
        .fc .fc-toolbar-title { font-size: 2.2rem; color: #0ea5e9; font-weight: 900; text-transform: capitalize; }
        .fc .fc-button-primary { background: #f97316; border: none; text-transform: capitalize; font-weight: 800; border-radius: 1rem; padding: 0.6rem 1.2rem; box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3); transition: all 0.2s; }
        .fc .fc-button-primary:hover, .fc .fc-button-primary:not(:disabled).fc-button-active { background: #f43f5e; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(244, 63, 94, 0.4); }
        .fc-col-header-cell { background-color: #f8fafc; padding: 16px 0; color: #64748b; font-size: 1rem; border-bottom: 4px solid white !important; }
        .fc-daygrid-day-number { color: #94a3b8; font-weight: 800; padding: 10px !important; font-size: 1.1rem; }
        .fc-event { cursor: pointer; padding: 6px 10px; border-radius: 10px; font-weight: 800; border: none; transition: all 0.2s; background: #0ea5e9; box-shadow: 0 4px 6px rgba(14, 165, 233, 0.2); }
        .fc-event:hover { transform: scale(1.05) translateY(-2px); background: #f97316; box-shadow: 0 6px 12px rgba(249, 115, 22, 0.3); z-index: 10; }
        .fc-day-today { background-color: #fef3c7 !important; }
        .fc-daygrid-event-dot { display: none; }
        .fc-event-main, .fc-event-title, .fc-list-event-title { color: #ffffff !important; }
        .fc-list-day-cushion { background-color: #f0f9ff !important; color: #0ea5e9 !important; font-weight: 900; padding: 16px !important; font-size: 1.1rem; }
        .fc-list-event { background-color: #ffffff !important; transition: all 0.2s; }
        .fc-list-event:hover td { background-color: #fef08a !important; }
        .fc-list-event-title a, .fc-list-event-time { color: #334155 !important; font-weight: 800; }
        .fc-list-event-dot { border-color: #f97316 !important; border-width: 5px !important; }
    </style>
</head>
<body class="bg-fond text-slate-700 font-sans min-h-screen flex flex-col">

    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b-4 border-ciel">
        <div class="max-w-6xl mx-auto px-6 py-3 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-3 group cursor-pointer hover:scale-105 transition-transform">
                <div class="bg-soleil text-white p-2.5 rounded-full shadow-lg shadow-soleil/30 transform rotate-[-10deg] group-hover:rotate-0 transition-all">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 3v18m-6-12h12"></path></svg>
                </div>
                <div><span class="text-2xl font-black text-ciel tracking-tight">Saint-François d'Assise</span></div>
            </div>
            <nav class="mt-4 md:mt-0 flex gap-6 text-base font-bold text-slate-500">
                <a href="/" class="hover:text-ciel hover:-translate-y-1 transition-all">Accueil</a>
                <a href="/messes" class="text-soleil border-b-4 border-soleil pb-1">Messes</a>
                <a href="/horaires" class="hover:text-ciel hover:-translate-y-1 transition-all">Ouverture Églises</a>
                <a href="/contact" class="hover:text-ciel hover:-translate-y-1 transition-all">Contact</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-6xl font-black text-slate-800 tracking-tight">Agenda des Messes</h1>
            <p class="text-slate-500 font-bold text-xl mt-2">Retrouvez toutes les célébrations de la paroisse.</p>
        </div>
        
        <div class="mb-8 flex items-center gap-4 bg-ciel p-6 rounded-[2rem] shadow-xl shadow-ciel/20 text-white">
            <span class="text-4xl">⛪</span>
            <div class="w-full">
                <label class="text-sm font-black text-blue-100 uppercase tracking-wider block mb-1">Filtrer par église</label>
                <select id="filtre-eglise" onchange="filtrerCalendrier()" class="w-full text-2xl font-black text-white bg-transparent outline-none cursor-pointer border-b-2 border-white/30 pb-2 focus:border-white transition-colors">
                    <option value="toutes" class="text-slate-800">🌍 Voir toutes les églises</option>
                </select>
            </div>
        </div>

        <div class="bg-white rounded-[3rem] p-6 md:p-10 shadow-2xl shadow-slate-200/50 border-4 border-white">
            <div id="calendrier-messes"></div>
        </div>
    </main>

    <footer class="bg-ciel text-white text-center py-10 mt-12 font-bold"><p>&copy; 2026 Paroisse Saint-François d'Assise</p></footer>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let messesData = [], calendar;

        async function chargerMesses() {
            const { data } = await _supabase.from('horaires_messes').select('*');
            messesData = data || [];
            const eglises = [...new Set(messesData.map(m => m.lieu))].filter(Boolean).sort();
            const select = document.getElementById('filtre-eglise');
            eglises.forEach(e => select.innerHTML += `<option value="${e}" class="text-slate-800">📍 ${e}</option>`);
            initCalendar(messesData);
        }

        function initCalendar(donnees) {
            const evts = donnees.filter(m => m.jour && m.jour.includes('-')).map(m => ({
                title: `${m.heure} - ${m.lieu.split('–')[0].trim()}`,
                start: m.jour,
                extendedProps: { lieu: m.lieu, heure: m.heure, remarques: m.remarques }
            }));

            calendar = new FullCalendar.Calendar(document.getElementById('calendrier-messes'), {
                initialView: 'dayGridMonth', locale: 'fr', firstDay: 1, height: 'auto',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listMonth' },
                buttonText: { today: "Aujourd'hui", month: 'Grille', list: 'Liste' },
                events: evts,
                eventClick: function(info) {
                    const p = info.event.extendedProps;
                    alert(`⛪ ${p.lieu}\n🕒 ${p.heure}\n\nℹ️ ${p.remarques || 'Aucune remarque'}`);
                }
            });
            calendar.render();
        }

        function filtrerCalendrier() {
            const lc = document.getElementById('filtre-eglise').value;
            const df = lc === 'toutes' ? messesData : messesData.filter(m => m.lieu === lc);
            calendar.removeAllEvents();
            calendar.addEventSource(df.filter(m => m.jour && m.jour.includes('-')).map(m => ({ title: `${m.heure} - ${m.lieu.split('–')[0].trim()}`, start: m.jour, extendedProps: { lieu: m.lieu, heure: m.heure, remarques: m.remarques } })));
        }
        chargerMesses();
    </script>
</body>
</html>
