<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messes - Paroisse Saint-François d'Assise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { nuit: '#1e3a8a', or: '#d97706', sable: '#fef3c7' }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Bibliothèques du Calendrier Professionnel (FullCalendar) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>
    
    <!-- Design sur-mesure du calendrier -->
    <style>
        .fc { font-family: 'Inter', sans-serif; }
        .fc-theme-standard .fc-scrollgrid { border: none; border-radius: 1rem; overflow: hidden; }
        .fc .fc-toolbar-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #1e3a8a; font-weight: bold; text-transform: capitalize; }
        .fc .fc-button-primary { background-color: #1e3a8a; border-color: #1e3a8a; text-transform: capitalize; font-weight: bold; border-radius: 0.5rem; }
        .fc .fc-button-primary:hover { background-color: #d97706; border-color: #d97706; }
        .fc .fc-button-primary:not(:disabled).fc-button-active { background-color: #d97706; border-color: #d97706; }
        .fc-col-header-cell { background-color: #f8fafc; padding: 12px 0; color: #1e3a8a; text-transform: capitalize; border-bottom: 2px solid #e2e8f0 !important; }
        .fc-daygrid-day-number { color: #475569; font-weight: 600; padding: 8px !important; }
        .fc-event { cursor: pointer; padding: 4px; border-radius: 6px; font-weight: 600; border: none; transition: transform 0.2s; background-color: #1e3a8a; }
        .fc-event:hover { transform: scale(1.02); background-color: #d97706; }
        .fc-day-today { background-color: #fef3c7 !important; } /* Couleur Sable pour aujourd'hui */
        .fc-daygrid-event-dot { display: none; } /* Enlever le petit point par défaut */
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-nuit text-or p-2 rounded-full shadow-md"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 3v18m-6-12h12"></path></svg></div>
                <span class="text-2xl font-serif font-bold text-nuit block leading-none">Saint-François d'Assise</span>
            </div>
            <nav class="mt-4 md:mt-0 flex gap-8 text-sm font-semibold text-slate-600">
                <a href="/" class="hover:text-nuit pb-1 transition-all">Accueil</a>
                <a href="/messes" class="text-or border-b-2 border-or pb-1 transition-all">Messes</a>
                <a href="/horaires" class="hover:text-nuit pb-1 transition-all">Ouverture des Églises</a>
                <a href="/contact" class="hover:text-nuit pb-1 transition-all">Contact</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-serif font-bold text-nuit mb-4">Calendrier des Célébrations</h1>
            <p class="text-slate-600 text-lg">Retrouvez toutes les messes de notre secteur paroissial.</p>
        </div>
        
        <!-- Filtre par Église -->
        <div class="mb-8 flex items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <span class="text-3xl">⛪</span>
            <div class="w-full">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wide">Afficher le planning de :</label>
                <select id="filtre-eglise" onchange="filtrerCalendrier()" class="w-full text-xl font-bold text-nuit bg-transparent outline-none cursor-pointer mt-1">
                    <option value="toutes">🌍 Toutes les églises du secteur</option>
                    <!-- Les options s'ajouteront ici tout seul -->
                </select>
            </div>
        </div>

        <!-- Le Calendrier -->
        <div class="bg-white rounded-3xl p-6 md:p-10 shadow-xl border-t-[6px] border-nuit">
            <div id="calendrier-messes"></div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-center py-10 text-sm mt-auto"><p>&copy; 2026 Paroisse Saint-François d'Assise</p></footer>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let messesData = [];
        let calendar;

        async function chargerMesses() {
            const { data, error } = await _supabase.from('horaires_messes').select('*');
            if (error) return;
            messesData = data || [];
            
            // 1. Remplir le menu déroulant avec le nom des églises
            const eglises = [...new Set(messesData.map(m => m.lieu))].filter(Boolean).sort();
            const select = document.getElementById('filtre-eglise');
            eglises.forEach(e => {
                select.innerHTML += `<option value="${e}">📍 ${e}</option>`;
            });

            // 2. Initialiser le calendrier
            initCalendar(messesData);
        }

        function formatterEvenements(donnees) {
            // Transforme les données de Supabase en événements pour le Calendrier
            return donnees
                .filter(m => m.jour && m.jour.includes('-')) // Garde uniquement les vraies dates (YYYY-MM-DD)
                .map(m => {
                    return {
                        title: `${m.heure} - ${m.lieu}`, // Texte dans la case
                        start: m.jour,
                        extendedProps: { lieu: m.lieu, heure: m.heure, remarques: m.remarques }
                    };
                });
        }

        function initCalendar(donnees) {
            const calendarEl = document.getElementById('calendrier-messes');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'fr', // Calendrier en Français
                firstDay: 1, // La semaine commence le Lundi
                height: 'auto',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth' // Boutons pour passer en vue Grille ou Liste
                },
                buttonText: {
                    today: "Aujourd'hui",
                    month: 'Grille',
                    list: 'Vue Liste'
                },
                events: formatterEvenements(donnees), // On charge les messes
                eventClick: function(info) {
                    // Quand on clique sur une messe dans le calendrier
                    const props = info.event.extendedProps;
                    alert(`⛪ Lieu : ${props.lieu}\n🕒 Heure : ${props.heure}\n\nℹ️ Infos : ${props.remarques || 'Aucune remarque particulière'}`);
                }
            });
            calendar.render();
        }

        function filtrerCalendrier() {
            const lieuChoisi = document.getElementById('filtre-eglise').value;
            let dataFiltree = messesData;
            
            if (lieuChoisi !== 'toutes') {
                dataFiltree = messesData.filter(m => m.lieu === lieuChoisi);
            }
            
            // Effacer les anciennes messes et mettre les nouvelles
            calendar.removeAllEvents();
            calendar.addEventSource(formatterEvenements(dataFiltree));
        }

        chargerMesses();
    </script>
</body>
</html>
