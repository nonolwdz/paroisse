<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Paroisse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { nuit: '#1e3a8a', or: '#d97706', sable: '#fef3c7', emeraude: '#059669' } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <header class="bg-nuit text-white p-4 shadow-md flex justify-between items-center">
        <span class="text-xl font-serif font-bold">⚙️ Back-Office</span>
        <div>
            <a href="/" class="text-xs bg-white/20 px-3 py-2 rounded mr-2">Voir le site</a>
            <button id="btn-logout" class="hidden text-xs bg-red-500 px-3 py-2 rounded font-bold" onclick="seDeconnecter()">Déconnexion</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div id="section-login" class="bg-white p-10 rounded-3xl shadow-xl max-w-md mx-auto mt-12">
            <h2 class="text-3xl font-serif font-bold text-center mb-8">Connexion</h2>
            <div class="space-y-4">
                <input type="email" id="email" class="w-full border-2 p-3 rounded-lg" placeholder="Email">
                <input type="password" id="password" class="w-full border-2 p-3 rounded-lg" placeholder="Mot de passe">
                <button onclick="seConnecter()" class="w-full bg-nuit text-white font-bold py-3 rounded-lg">Se connecter</button>
            </div>
        </div>

        <div id="section-dashboard" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- ÉGLISES (AVEC TEMPS RÉEL) -->
            <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-blue-400">
                <h3 class="text-xl font-serif font-bold text-blue-900 mb-4">🗝️ Gérer une Église</h3>
                <div class="space-y-3">
                    <input type="text" id="eglise-nom" placeholder="Nom de l'église" class="w-full border p-3 rounded-lg">
                    <input type="text" id="eglise-horaires" placeholder="Texte des Horaires (ex: 9h-18h)" class="w-full border p-3 rounded-lg">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-slate-500">Heure Ouverture (Calcul)</label>
                            <input type="time" id="eglise-ouv" class="w-full border p-3 rounded-lg">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500">Heure Fermeture (Calcul)</label>
                            <input type="time" id="eglise-fer" class="w-full border p-3 rounded-lg">
                        </div>
                    </div>
                    <label class="flex items-center gap-2 bg-red-50 p-3 rounded-lg border border-red-200 cursor-pointer">
                        <input type="checkbox" id="eglise-estferme" class="w-5 h-5 accent-red-600">
                        <span class="font-bold text-red-800 text-sm">Fermeture exceptionnelle active</span>
                    </label>
                    <input type="text" id="eglise-alerte" placeholder="Message d'alerte (Optionnel)" class="w-full border border-red-300 p-3 rounded-lg">
                    <button id="btn-save-eglise" onclick="ajouterEglise()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Enregistrer l'église</button>
                </div>
            </div>

            <!-- MESSES -->
            <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-or">
                <h3 class="text-xl font-serif font-bold text-or mb-4">⛪ Ajouter une Messe</h3>
                <div class="space-y-3">
                    <select id="messe-lieu" class="w-full border p-3 rounded-lg font-medium"></select>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" id="messe-jour" class="w-full border p-3 rounded-lg">
                        <input type="time" id="messe-heure" class="w-full border p-3 rounded-lg">
                    </div>
                    <input type="text" id="messe-remarques" placeholder="Remarques (ex: Messe des familles)" class="w-full border p-3 rounded-lg">
                    <button id="btn-save-messe" onclick="ajouterMesse()" class="w-full bg-or text-white py-3 rounded-lg font-bold">Ajouter au calendrier</button>
                </div>
            </div>

            <!-- GESTION -->
            <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-slate-800 lg:col-span-2">
                <h3 class="text-2xl font-serif font-bold mb-6">🗑️ Suppression</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <h4 class="font-bold border-b pb-2 mb-2 text-sm text-blue-800">Églises</h4>
                        <div id="liste-eglises" class="space-y-2 text-xs max-h-48 overflow-y-auto"></div>
                    </div>
                    <div>
                        <h4 class="font-bold border-b pb-2 mb-2 text-sm text-or">Messes</h4>
                        <div id="liste-messes" class="space-y-2 text-xs max-h-48 overflow-y-auto"></div>
                    </div>
                    <div>
                        <h4 class="font-bold border-b pb-2 mb-2 text-sm text-pink-600">Bonnes Ondes</h4>
                        <div id="liste-ondes" class="space-y-2 text-xs max-h-48 overflow-y-auto"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let editEgliseId = null, editMesseId = null;

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { document.getElementById('section-login').classList.add('hidden'); document.getElementById('section-dashboard').classList.remove('hidden'); document.getElementById('btn-logout').classList.remove('hidden'); chargerDonnees(); }
        }
        async function seConnecter() {
            const email = document.getElementById('email').value, password = document.getElementById('password').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (!error) location.reload();
        }
        async function seDeconnecter() { await _supabase.auth.signOut(); location.reload(); }

        async function ajouterEglise() {
            const nom = document.getElementById('eglise-nom').value;
            const horaires_base = document.getElementById('eglise-horaires').value;
            const heure_ouverture = document.getElementById('eglise-ouv').value || null;
            const heure_fermeture = document.getElementById('eglise-fer').value || null;
            const est_ferme = document.getElementById('eglise-estferme').checked;
            const alerte = document.getElementById('eglise-alerte').value;
            
            if (editEgliseId) await _supabase.from('horaires_eglises').update({ nom, horaires_base, heure_ouverture, heure_fermeture, est_ferme, alerte }).eq('id', editEgliseId);
            else await _supabase.from('horaires_eglises').insert([{ nom, horaires_base, heure_ouverture, heure_fermeture, est_ferme, alerte }]);
            editEgliseId = null; document.getElementById('btn-save-eglise').innerText = "Enregistrer l'église";
            chargerDonnees();
        }

        async function ajouterMesse() {
            const lieu = document.getElementById('messe-lieu').value, jour = document.getElementById('messe-jour').value, heure = document.getElementById('messe-heure').value, remarques = document.getElementById('messe-remarques').value;
            if (editMesseId) await _supabase.from('horaires_messes').update({ lieu, jour, heure, remarques }).eq('id', editMesseId);
            else await _supabase.from('horaires_messes').insert([{ lieu, jour, heure, remarques }]);
            editMesseId = null; document.getElementById('btn-save-messe').innerText = "Ajouter au calendrier";
            chargerDonnees();
        }

        async function chargerDonnees() {
            // Eglises
            const { data: eglises } = await _supabase.from('horaires_eglises').select('*');
            const selectLieu = document.getElementById('messe-lieu');
            selectLieu.innerHTML = '<option value="" disabled selected>Église...</option>';
            document.getElementById('liste-eglises').innerHTML = (eglises||[]).map(e => {
                selectLieu.innerHTML += `<option value="${e.nom}">${e.nom}</option>`;
                return `<div class="flex justify-between bg-white p-2 border rounded"><span>${e.nom}</span> <button onclick="supprimer('horaires_eglises', ${e.id})" class="text-red-500 font-bold">✖</button></div>`;
            }).join('');

            // Messes
            const { data: messes } = await _supabase.from('horaires_messes').select('*');
            document.getElementById('liste-messes').innerHTML = (messes||[]).map(m => `<div class="flex justify-between bg-white p-2 border rounded"><span>${m.lieu} - ${m.jour}</span> <button onclick="supprimer('horaires_messes', ${m.id})" class="text-red-500 font-bold">✖</button></div>`).join('');

            // Bonnes Ondes
            const { data: ondes } = await _supabase.from('bonnes_ondes').select('*');
            document.getElementById('liste-ondes').innerHTML = (ondes||[]).map(o => `<div class="flex justify-between bg-white p-2 border rounded"><span class="truncate pr-2">"${o.message}"</span> <button onclick="supprimer('bonnes_ondes', ${o.id})" class="text-red-500 font-bold">✖</button></div>`).join('');
        }

        async function supprimer(table, id) { if(confirm("Supprimer ?")) { await _supabase.from(table).delete().eq('id', id); chargerDonnees(); } }

        checkSession();
    </script>
</body>
</html>
