<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Paroisse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">⚙️ Espace Administration</h1>
        <button id="btn-logout" class="hidden text-sm bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white font-bold" onclick="seDeconnecter()">Se déconnecter</button>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- SECTION CONNEXION -->
        <div id="section-login" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 max-w-md mx-auto mt-12">
            <h2 class="text-2xl font-bold text-center mb-6 text-slate-800">Connexion</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-1 text-slate-600">Adresse E-mail</label>
                    <input type="email" id="email" class="w-full border border-slate-300 rounded p-2 focus:border-blue-500 outline-none" placeholder="admin@paroisse.fr">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1 text-slate-600">Mot de passe</label>
                    <input type="password" id="password" class="w-full border border-slate-300 rounded p-2 focus:border-blue-500 outline-none" placeholder="••••••••">
                </div>
                <button onclick="seConnecter()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-2">Accéder au Back-office</button>
                <p id="login-error" class="text-red-500 text-sm mt-2 hidden">Identifiants incorrects.</p>
            </div>
        </div>

        <!-- SECTION DASHBOARD (Cachée par défaut) -->
        <div id="section-dashboard" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Formulaire Actualité -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-emerald-800 mb-4 border-b pb-2">➕ Ajouter une Actualité</h3>
                <div class="space-y-3">
                    <input type="text" id="actu-titre" placeholder="Titre (ex: Fête paroissiale)" class="w-full border border-slate-300 rounded p-2 text-sm">
                    <input type="date" id="actu-date" class="w-full border border-slate-300 rounded p-2 text-sm">
                    <textarea id="actu-contenu" rows="4" placeholder="Contenu de l'annonce..." class="w-full border border-slate-300 rounded p-2 text-sm"></textarea>
                    <button onclick="ajouterActualite()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded text-sm font-bold">Publier l'actualité</button>
                    <p id="actu-msg" class="text-sm mt-2"></p>
                </div>
            </div>

            <!-- Formulaire Messe -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-sky-800 mb-4 border-b pb-2">➕ Ajouter une Messe</h3>
                <div class="space-y-3">
                    <input type="text" id="messe-lieu" placeholder="Lieu (ex: Église de Domérat)" class="w-full border border-slate-300 rounded p-2 text-sm">
                    <input type="text" id="messe-jour" placeholder="Jour (ex: Dimanche 14 oct)" class="w-full border border-slate-300 rounded p-2 text-sm">
                    <input type="text" id="messe-heure" placeholder="Heure (ex: 11h00)" class="w-full border border-slate-300 rounded p-2 text-sm">
                    <input type="text" id="messe-remarques" placeholder="Remarques (ex: Messe des familles)" class="w-full border border-slate-300 rounded p-2 text-sm">
                    <button onclick="ajouterMesse()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded text-sm font-bold">Ajouter l'horaire</button>
                    <p id="messe-msg" class="text-sm mt-2"></p>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Vérifier si on est déjà connecté au chargement de la page
        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { afficherDashboard(); }
        }

        // Fonction pour se connecter
        async function seConnecter() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('login-error').classList.remove('hidden');
            } else {
                document.getElementById('login-error').classList.add('hidden');
                afficherDashboard();
            }
        }

        // Fonction pour se déconnecter
        async function seDeconnecter() {
            await _supabase.auth.signOut();
            document.getElementById('section-login').classList.remove('hidden');
            document.getElementById('section-dashboard').classList.add('hidden');
            document.getElementById('btn-logout').classList.add('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // Basculer l'affichage
        function afficherDashboard() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-dashboard').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
        }

        // Ajouter une actualité
        async function ajouterActualite() {
            const titre = document.getElementById('actu-titre').value;
            const date = document.getElementById('actu-date').value;
            const contenu = document.getElementById('actu-contenu').value;
            const msg = document.getElementById('actu-msg');

            const { error } = await _supabase.from('actualites').insert([{ titre: titre, date_publication: date, contenu: contenu }]);
            
            if (error) {
                msg.innerHTML = '<span class="text-red-500">Erreur lors de l\'ajout.</span>';
            } else {
                msg.innerHTML = '<span class="text-emerald-600 font-bold">Actualité ajoutée avec succès !</span>';
                document.getElementById('actu-titre').value = '';
                document.getElementById('actu-date').value = '';
                document.getElementById('actu-contenu').value = '';
            }
        }

        // Ajouter une messe
        async function ajouterMesse() {
            const lieu = document.getElementById('messe-lieu').value;
            const jour = document.getElementById('messe-jour').value;
            const heure = document.getElementById('messe-heure').value;
            const remarques = document.getElementById('messe-remarques').value;
            const msg = document.getElementById('messe-msg');

            const { error } = await _supabase.from('horaires_messes').insert([{ lieu: lieu, jour: jour, heure: heure, remarques: remarques }]);
            
            if (error) {
                msg.innerHTML = '<span class="text-red-500">Erreur lors de l\'ajout.</span>';
            } else {
                msg.innerHTML = '<span class="text-sky-600 font-bold">Horaire ajouté avec succès !</span>';
                document.getElementById('messe-lieu').value = '';
                document.getElementById('messe-jour').value = '';
                document.getElementById('messe-heure').value = '';
                document.getElementById('messe-remarques').value = '';
            }
        }

        checkSession();
    </script>
</body>
</html>
