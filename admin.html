<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Paroisse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { nuit: '#1e3a8a', or: '#d97706', sable: '#fef3c7' }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <header class="bg-nuit text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-xl font-serif font-bold">⚙️ Back-Office Paroisse</span>
            <a href="/" class="text-xs bg-white/20 px-3 py-1 rounded hover:bg-white/30 transition">Voir le site</a>
        </div>
        <button id="btn-logout" class="hidden text-sm bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-white font-bold transition" onclick="seDeconnecter()">Déconnexion</button>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-12">
        
        <!-- SECTION CONNEXION -->
        <div id="section-login" class="bg-white p-10 rounded-3xl shadow-xl border-t-[6px] border-or max-w-md mx-auto mt-12">
            <h2 class="text-3xl font-serif font-bold text-center mb-8 text-nuit">Connexion</h2>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-bold mb-2 text-slate-600">Adresse E-mail</label>
                    <input type="email" id="email" class="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-nuit outline-none transition" placeholder="admin@paroisse.fr">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2 text-slate-600">Mot de passe</label>
                    <input type="password" id="password" class="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-nuit outline-none transition" placeholder="••••••••">
                </div>
                <button onclick="seConnecter()" class="w-full bg-nuit hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-lg mt-4 transition shadow-md">Accéder à la gestion</button>
                <p id="login-error" class="text-red-500 text-sm mt-2 text-center hidden font-semibold">Identifiants incorrects.</p>
            </div>
        </div>

        <!-- SECTION DASHBOARD -->
        <div id="section-dashboard" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-nuit">
                <h3 class="text-xl font-serif font-bold text-nuit mb-6 flex items-center gap-2">📢 Ajouter une Actualité</h3>
                <div class="space-y-4">
                    <input type="text" id="actu-titre" placeholder="Titre (ex: Kermesse paroissiale)" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-nuit outline-none">
                    <input type="date" id="actu-date" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-nuit outline-none">
                    <textarea id="actu-contenu" rows="4" placeholder="Contenu de l'annonce..." class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-nuit outline-none"></textarea>
                    <button onclick="ajouterActualite()" class="w-full bg-nuit hover:bg-blue-900 text-white py-3 rounded-lg text-sm font-bold transition shadow-sm">Publier l'actualité</button>
                    <p id="actu-msg" class="text-sm mt-2 text-center"></p>
                </div>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-or">
                <h3 class="text-xl font-serif font-bold text-or mb-6 flex items-center gap-2">⛪ Ajouter une Messe</h3>
                <div class="space-y-4">
                    <input type="text" id="messe-lieu" placeholder="Lieu (ex: Église de Domérat)" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-or outline-none">
                    <input type="text" id="messe-jour" placeholder="Jour (ex: Dimanche 14 oct)" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-or outline-none">
                    <input type="text" id="messe-heure" placeholder="Heure (ex: 11h00)" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-or outline-none">
                    <input type="text" id="messe-remarques" placeholder="Remarques (ex: Messe des familles)" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-or outline-none">
                    <button onclick="ajouterMesse()" class="w-full bg-or hover:bg-yellow-600 text-white py-3 rounded-lg text-sm font-bold transition shadow-sm">Ajouter l'horaire</button>
                    <p id="messe-msg" class="text-sm mt-2 text-center"></p>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { afficherDashboard(); }
        }

        async function seConnecter() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) { document.getElementById('login-error').classList.remove('hidden'); } 
            else { document.getElementById('login-error').classList.add('hidden'); afficherDashboard(); }
        }

        async function seDeconnecter() {
            await _supabase.auth.signOut();
            document.getElementById('section-login').classList.remove('hidden');
            document.getElementById('section-dashboard').classList.add('hidden');
            document.getElementById('btn-logout').classList.add('hidden');
            document.getElementById('email').value = ''; document.getElementById('password').value = '';
        }

        function afficherDashboard() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-dashboard').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
        }

        async function ajouterActualite() {
            const titre = document.getElementById('actu-titre').value;
            const date = document.getElementById('actu-date').value;
            const contenu = document.getElementById('actu-contenu').value;
            const msg = document.getElementById('actu-msg');
            const { error } = await _supabase.from('actualites').insert([{ titre: titre, date_publication: date, contenu: contenu }]);
            
            if (error) { msg.innerHTML = '<span class="text-red-500 font-bold">Erreur (As-tu bien désactivé le RLS dans Supabase ?)</span>'; } 
            else {
                msg.innerHTML = '<span class="text-emerald-600 font-bold">Actualité ajoutée avec succès !</span>';
                document.getElementById('actu-titre').value = ''; document.getElementById('actu-date').value = ''; document.getElementById('actu-contenu').value = '';
            }
        }

        async function ajouterMesse() {
            const lieu = document.getElementById('messe-lieu').value;
            const jour = document.getElementById('messe-jour').value;
            const heure = document.getElementById('messe-heure').value;
            const remarques = document.getElementById('messe-remarques').value;
            const msg = document.getElementById('messe-msg');
            const { error } = await _supabase.from('horaires_messes').insert([{ lieu: lieu, jour: jour, heure: heure, remarques: remarques }]);
            
            if (error) { msg.innerHTML = '<span class="text-red-500 font-bold">Erreur (As-tu bien désactivé le RLS dans Supabase ?)</span>'; } 
            else {
                msg.innerHTML = '<span class="text-emerald-600 font-bold">Horaire ajouté avec succès !</span>';
                document.getElementById('messe-lieu').value = ''; document.getElementById('messe-jour').value = ''; document.getElementById('messe-heure').value = ''; document.getElementById('messe-remarques').value = '';
            }
        }
        checkSession();
    </script>
</body>
</html>
