<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Paroisse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { nuit: '#1e3a8a', or: '#d97706', sable: '#fef3c7' }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] } } } }
    </script>
<!-- Éditeur de texte avancé Quill -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <header class="bg-nuit text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-xl font-serif font-bold">⚙️ Back-Office Paroisse</span>
            <a href="/" class="text-xs bg-white/20 px-3 py-1 rounded hover:bg-white/30 transition">Voir le site</a>
        </div>
        <button id="btn-logout" class="hidden text-sm bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-white font-bold transition" onclick="seDeconnecter()">Déconnexion</button>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        
        <!-- SECTION CONNEXION -->
        <div id="section-login" class="bg-white p-10 rounded-3xl shadow-xl border-t-[6px] border-or max-w-md mx-auto mt-12">
            <h2 class="text-3xl font-serif font-bold text-center mb-8 text-nuit">Connexion</h2>
            <div class="space-y-5">
                <input type="email" id="email" class="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-nuit outline-none transition" placeholder="Email admin">
                <input type="password" id="password" class="w-full border-2 border-slate-200 rounded-lg p-3 focus:border-nuit outline-none transition" placeholder="Mot de passe">
                <button onclick="seConnecter()" class="w-full bg-nuit hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-lg mt-4 transition shadow-md">Accéder à la gestion</button>
                <p id="login-error" class="text-red-500 text-sm mt-2 text-center hidden font-semibold">Identifiants incorrects.</p>
            </div>
        </div>

        <!-- SECTION DASHBOARD -->
        <div id="section-dashboard" class="hidden grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- BLOC : MODIFIER L'IMAGE D'ACCUEIL -->
            <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-sable">
                <h3 class="text-xl font-serif font-bold text-slate-800 mb-6 flex items-center gap-2">🖼️ Image d'accueil</h3>
                <div class="space-y-4">
                    <p class="text-sm text-slate-500">Sélectionnez une nouvelle photo depuis votre ordinateur. Elle remplacera l'ancienne automatiquement.</p>
                    <input type="file" id="image-accueil" accept="image/jpeg, image/png" class="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-sable file:text-or hover:file:bg-yellow-200">
                    <button onclick="changerImage()" class="w-full bg-slate-800 hover:bg-black text-white py-3 rounded-lg text-sm font-bold transition shadow-sm">Remplacer l'image</button>
                    <p id="img-msg" class="text-sm mt-2 text-center"></p>
                </div>
            </div>

            <!-- BLOC : ACTUALITÉS -->
            <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-nuit">
                <h3 class="text-xl font-serif font-bold text-nuit mb-6 flex items-center gap-2">📢 Ajouter une Actualité</h3>
                <div class="space-y-4">
                    <input type="text" id="actu-titre" placeholder="Titre" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-nuit">
                    <input type="date" id="actu-date" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-nuit">
<div class="bg-white">
    <div id="editeur-actu" style="height: 200px;"></div>
</div>
                <button onclick="ajouterActualite()" class="w-full bg-nuit hover:bg-blue-900 text-white py-3 rounded-lg text-sm font-bold transition shadow-sm">Publier l'actualité</button>
                    <p id="actu-msg" class="text-sm mt-2 text-center"></p>
                </div>
            </div>

            <!-- BLOC : MESSES -->
            <div class="bg-white p-8 rounded-3xl shadow-lg border-t-[6px] border-or">
                <h3 class="text-xl font-serif font-bold text-or mb-6 flex items-center gap-2">⛪ Ajouter une Messe</h3>
                <div class="space-y-4">
                    <input type="text" id="messe-lieu" placeholder="Lieu (ex: Domérat)" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-or">
                    <input type="text" id="messe-jour" placeholder="Jour (ex: Dim. 14 oct)" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-or">
                    <input type="text" id="messe-heure" placeholder="Heure (ex: 11h00)" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-or">
                    <input type="text" id="messe-remarques" placeholder="Remarques éventuelles" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-or">
                    <button onclick="ajouterMesse()" class="w-full bg-or hover:bg-yellow-600 text-white py-3 rounded-lg text-sm font-bold transition shadow-sm">Ajouter l'horaire</button>
                    <p id="messe-msg" class="text-sm mt-2 text-center"></p>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tyxybtrthvmyzjefziop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nQf46_VAwZVxUm0hIQUFbA_fBiiaJvP'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { afficherDashboard(); }
        }

        async function seConnecter() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) { document.getElementById('login-error').classList.remove('hidden'); } 
            else { document.getElementById('login-error').classList.add('hidden'); afficherDashboard(); }
        }

        async function seDeconnecter() {
            await _supabase.auth.signOut();
            document.getElementById('section-login').classList.remove('hidden');
            document.getElementById('section-dashboard').classList.add('hidden');
            document.getElementById('btn-logout').classList.add('hidden');
        }

        function afficherDashboard() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-dashboard').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
        }

        // Fonction pour uploader l'image vers Supabase
        async function changerImage() {
            const input = document.getElementById('image-accueil');
            const msg = document.getElementById('img-msg');
            if (!input.files || input.files.length === 0) {
                msg.innerHTML = '<span class="text-red-500">Veuillez sélectionner une image.</span>';
                return;
            }
            
            msg.innerHTML = '<span class="text-slate-500 font-bold">Envoi de l\'image en cours... ⏳</span>';
            const file = input.files[0];
            
            // Le paramètre upsert: true permet d'écraser l'ancienne image
            const { error } = await _supabase.storage.from('images').upload('accueil.jpg', file, { cacheControl: '0', upsert: true });

            if (error) {
                msg.innerHTML = '<span class="text-red-500 font-bold">Erreur : Vérifiez les règles Policies dans Supabase.</span>';
            } else {
                msg.innerHTML = '<span class="text-emerald-600 font-bold">✅ Photo mise à jour !</span>';
                input.value = '';
            }
        }

        async function ajouterActualite() {
            const titre = document.getElementById('actu-titre').value;
            const date = document.getElementById('actu-date').value;
            const contenu = quill.root.innerHTML;
            const msg = document.getElementById('actu-msg');
            const { error } = await _supabase.from('actualites').insert([{ titre, date_publication: date, contenu }]);
            if (error) { msg.innerHTML = '<span class="text-red-500 font-bold">Erreur (Désactivez le RLS dans Supabase)</span>'; } 
            else { msg.innerHTML = '<span class="text-emerald-600 font-bold">✅ Ajouté !</span>'; }
        }

        async function ajouterMesse() {
            const lieu = document.getElementById('messe-lieu').value;
            const jour = document.getElementById('messe-jour').value;
            const heure = document.getElementById('messe-heure').value;
            const remarques = document.getElementById('messe-remarques').value;
            const msg = document.getElementById('messe-msg');
            const { error } = await _supabase.from('horaires_messes').insert([{ lieu, jour, heure, remarques }]);
            if (error) { msg.innerHTML = '<span class="text-red-500 font-bold">Erreur (Désactivez le RLS dans Supabase)</span>'; } 
            else { msg.innerHTML = '<span class="text-emerald-600 font-bold">✅ Ajouté !</span>'; }
        }

        checkSession();
    // Initialisation de l'éditeur riche
var quill = new Quill('#editeur-actu', {
    theme: 'snow',
    modules: {
        toolbar: [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'color': [] }, { 'background': [] }],
            ['link', 'image'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            ['clean']
        ]
    }
});
    </script>
</body>
</html>
